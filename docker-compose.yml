services:
  db:
    image: postgres:16
    container_name: ah_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first volume create, not on every compose up.
      - ./Databasing/CapstoneDDLScript.sql:/docker-entrypoint-initdb.d/01-ddl.sql
      - ./Databasing/CapstoneDMLScript.sql:/docker-entrypoint-initdb.d/02-dml.sql
      - ./Databasing/ProfEvalStat.sql:/docker-entrypoint-initdb.d/03-eval-status-view.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ah_backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEBULALABS_API_KEY: ${NEBULALABS_API_KEY}
      ANONYMIZATION_KEY: ${ANONYMIZATION_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
      - ./NebulaLabsIntegration:/ingest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      coursebook:
        condition: service_completed_successfully

  # Image build does not call Nebula. This runs once on compose up after db is healthy.
  coursebook:
    build: ./NebulaLabsIntegration
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEBULALABS_API_KEY: ${NEBULALABS_API_KEY}
      ANONYMIZATION_KEY: ${ANONYMIZATION_KEY}
      COURSEBOOK_TERM: ${COURSEBOOK_TERM:-26F}
      COURSEBOOK_PREFIX: ${COURSEBOOK_PREFIX:-CS}
    depends_on:
      db:
        condition: service_healthy
    # Image ENTRYPOINT is python ingest.py (used by the tools profile). Override it here.
    entrypoint: ["sh", "/app/on-start.sh"]

  ingest:
    profiles: ["tools"]
    build: ./NebulaLabsIntegration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEBULALABS_API_KEY: ${NEBULALABS_API_KEY}
      ANONYMIZATION_KEY: ${ANONYMIZATION_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
